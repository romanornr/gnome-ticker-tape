# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

tone_instructions: >
  Reviewer for a GNOME Shell extension (GJS/ESM, no build step). Prioritize
  market-data correctness, provider boundaries, and shell lifecycle safety
  over style nits. A plausible but wrong quote is the worst failure mode,
  worse than a crash.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  sequence_diagrams: false

  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "utils/catalog/**"
      instructions: >-
        Curated catalog data. Symbols use a historical Stooq-style form
        (aapl.us, 700.hk, eurusd) that is frozen: saved user gsettings
        contain these strings, so renaming the format silently breaks
        existing installs. Providers translate at their own boundary
        instead. Entries stay alphabetized by label. New or changed
        symbols must be verified against the live provider before merge;
        flag any that look unverified, and be suspicious of short tickers
        that can silently resolve to a different company on another
        exchange.

    - path: "services/providers/**"
      instructions: >-
        Provider adapters own wire formats and nothing else. They must
        normalize into {price, quoteDate: 'YYYYMMDD', previousClose|null}
        keyed by uppercase catalog symbol before anything downstream sees
        the data. CNBC is the primary REST source; Nasdaq and the FX rate
        table are fallbacks that must only claim symbols they genuinely
        serve. Nasdaq in particular must never own non-US symbols, because
        it returns a real but wrong price for foreign listings (their US
        ADR). Batch parsing stays tolerant: one unusable entry must not
        discard the rest of the batch.

    - path: "services/**"
      instructions: >-
        Runtime orchestration. Watch for anything that can hang or leak
        across enable/disable: unbounded requests, timers or signal
        handlers without teardown, websocket reconnect loops, and async
        callbacks that touch state after stop(). Provider-specific parsing
        does not belong at this layer.

    - path: "**/*.js"
      instructions: >-
        GJS/ESM targeting GNOME Shell 49-50, no build step and no runtime
        dependencies: flag any Node-only API, bundler assumption, or new
        third-party import. Comments follow CODE_STYLE_GUIDE.md: require them
        only for non-obvious ownership, provider semantics, or lifecycle
        invariants, and flag comments that restate names or syntax as noise.

    - path: "tests/**"
      instructions: >-
        Plain GJS test suites run by tests/run.js with no framework; new
        suites must be registered there to run at all. New provider
        behavior should come with fixture-based parsing tests and
        failure-path coverage, not only happy paths.

    - path: "**/*.sh"
      instructions: >-
        Install and check scripts users run directly. They must stay
        POSIX-friendly bash with set -euo pipefail, must not assume a
        package manager or network access, and must never delete outside
        the extension's own install directory.

  # Docstring generation contradicts CODE_STYLE_GUIDE.md, which asks for
  # system-boundary comments rather than per-function API docs. Generated
  # unit tests do not fit the hand-registered tests/run.js harness.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: true

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
    description:
      mode: warning

  tools:
    # Relevant to this repo: shell installers, YAML config, future workflows.
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true

    # Prose linters fire constantly on the long-form guide docs.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

    # No infrastructure-as-code, containers, or dependency manifests here.
    checkov:
      enabled: false
    trivy:
      enabled: false
    hadolint:
      enabled: false
    tflint:
      enabled: false
    osvScanner:
      enabled: false
    checkmake:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    # Defaults cover CLAUDE.md; this repo keeps its real conventions in the
    # style guide and the agent file map.
    filePatterns:
      - "CODE_STYLE_GUIDE.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "DEBUGGING_GUIDE.md"
